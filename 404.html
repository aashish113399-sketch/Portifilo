<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Aashish Chand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#cdd6f4}
    .glass{background:rgba(24,24,37,0.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.06)}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  <div class="absolute inset-0 -z-10">
    <div class="absolute -top-[40%] -left-[20%] w-[80%] h-[80%] rounded-full bg-gradient-to-br from-violet-600/20 to-indigo-600/20 blur-[120px]"></div>
    <div class="absolute -bottom-[30%] -right-[20%] w-[70%] h-[70%] rounded-full bg-gradient-to-br from-cyan-500/15 to-violet-600/15 blur-[120px]"></div>
  </div>
  <div class="text-center max-w-md">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-violet-600 to-cyan-500 flex items-center justify-center font-bold text-white text-xl mb-6 shadow-xl shadow-violet-600/20">AC</div>
    <h1 class="font-bold text-4xl md:text-5xl tracking-tight" style="font-family:'Space Grotesk'">Lost in space?</h1>
    <p class="mt-4 text-[#a6adc8] leading-6">The page you're looking for doesn't exist. Maybe it was moved or you typed the wrong URL.</p>
    <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/Portifilo/" class="inline-flex items-center justify-center gap-2 bg-white text-black px-6 py-3 rounded-full font-medium hover:bg-white/90 transition">← Back Home</a>
      <a href="https://github.com/aashish113399-sketch/Portifilo" class="inline-flex items-center justify-center gap-2 glass px-6 py-3 rounded-full font-medium hover:bg-white/10 transition">View on GitHub</a>
    </div>
    <p class="mt-10 text-xs font-mono text-[#6c7086]">404 • aashish.dev • Nepal 🇳🇵</p>
  </div>
</body>
</html>
